# Exomiser analysis template -- rendered by stage 3 (exomiser_runner) of
# agents/pipeline.ag with the .ag `replace_all` helper (agentis has no native
# `replace` builtin; the helper is literal index_of/substring recursion).
#
# Placeholders: {{ASSEMBLY}} {{VCF}} {{PROBAND}} {{HPO_IDS}}
#               {{FAILED_VARIANT_FILTER}} {{OUTPUT_DIR}} {{OUTPUT_PREFIX}}
#
# Two decisions are load-bearing here:
#
# 1. `failedVariantFilter` is a PLACEHOLDER, not a fixed step. The main run
#    renders it EMPTY, so records that failed the upstream GATK hard filters
#    survive into the ranking -- a low-VAF mosaic variant (exactly what a
#    mosaic-variegated-aneuploidy proband may carry) is the kind of record
#    those filters throw away. `--pass-only-comparison` renders the step in
#    and produces a second output set, so the cost of the decision is
#    measurable instead of assumed.
#
# 2. `analysisMode: PASS_ONLY` refers to EXOMISER's own filters, not to the
#    VCF FILTER column: it discards variants as they fail Exomiser's steps
#    instead of carrying them all in memory. On a WGS VCF, FULL mode needs
#    far more heap for no gain in the ranking.
analysis:
    genomeAssembly: {{ASSEMBLY}}
    vcf: {{VCF}}
    proband: {{PROBAND}}
    hpoIds: [{{HPO_IDS}}]
    # No parental samples exist in this challenge, so every mode is left on
    # and inheritance is a ranking signal rather than a hard filter.
    inheritanceModes: {
        AUTOSOMAL_DOMINANT: 0.1,
        AUTOSOMAL_RECESSIVE_HOM_ALT: 0.1,
        AUTOSOMAL_RECESSIVE_COMP_HET: 2.0,
        X_DOMINANT: 0.1,
        X_RECESSIVE_HOM_ALT: 0.1,
        X_RECESSIVE_COMP_HET: 2.0,
        MITOCHONDRIAL: 0.2
    }
    analysisMode: PASS_ONLY
    frequencySources: [
        THOUSAND_GENOMES,
        TOPMED,
        UK10K,
        ESP_AFRICAN_AMERICAN, ESP_EUROPEAN_AMERICAN, ESP_ALL,
        EXAC_AFRICAN_INC_AFRICAN_AMERICAN, EXAC_AMERICAN,
        EXAC_SOUTH_ASIAN, EXAC_EAST_ASIAN,
        EXAC_FINNISH, EXAC_NON_FINNISH_EUROPEAN, EXAC_OTHER,
        GNOMAD_E_AFR, GNOMAD_E_AMR, GNOMAD_E_EAS, GNOMAD_E_FIN,
        GNOMAD_E_NFE, GNOMAD_E_SAS,
        GNOMAD_G_AFR, GNOMAD_G_AMR, GNOMAD_G_EAS, GNOMAD_G_FIN,
        GNOMAD_G_NFE, GNOMAD_G_SAS
    ]
    pathogenicitySources: [REVEL, MVP]
    steps: [
        {{FAILED_VARIANT_FILTER}}
        variantEffectFilter: {
            remove: [
                FIVE_PRIME_UTR_EXON_VARIANT,
                FIVE_PRIME_UTR_INTRON_VARIANT,
                THREE_PRIME_UTR_EXON_VARIANT,
                THREE_PRIME_UTR_INTRON_VARIANT,
                NON_CODING_TRANSCRIPT_EXON_VARIANT,
                NON_CODING_TRANSCRIPT_INTRON_VARIANT,
                CODING_TRANSCRIPT_INTRON_VARIANT,
                UPSTREAM_GENE_VARIANT,
                DOWNSTREAM_GENE_VARIANT,
                INTERGENIC_VARIANT,
                REGULATORY_REGION_VARIANT
            ]
        },
        frequencyFilter: {maxFrequency: 2.0},
        pathogenicityFilter: {keepNonPathogenic: true},
        inheritanceFilter: {},
        omimPrioritiser: {},
        hiPhivePrioritiser: {}
    ]
outputOptions:
    outputContributingVariantsOnly: false
    numGenes: 0
    outputDirectory: {{OUTPUT_DIR}}
    outputFileName: {{OUTPUT_PREFIX}}
    outputFormats: [HTML, JSON, TSV_GENE, TSV_VARIANT]
