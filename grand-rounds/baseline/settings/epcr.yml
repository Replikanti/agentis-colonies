# EPCR ladder -- how a candidate becomes a number in the submission CSV.
#
# Exomiser's combined score is a RANKING score, not a probability: it is not
# calibrated, and reading it as "probability of causal relevance" would make
# every EPCR in the submission a fabricated number. So the ladder below drives
# the EPCR from the EVIDENCE TIER (what kind of support the candidate has),
# and the Exomiser score is used only to order candidates WITHIN a tier.
#
# Tier order in this file IS the ranking order. Editing a value here changes
# the submission; grand-rounds/baseline/demo-baseline.sh pins the resulting
# ordering against a golden CSV, so a change has to be deliberate.
#
# Read by the reconciler stage of agents/pipeline.ag (stage 5): the tiers are
# extracted with the regex_* / index_of builtins (a mapping of scalars + one
# list of scalar mappings), so no YAML library — or any interpreter — is
# involved. Editing a value here changes the submission ordering.

version: 1

tiers:
  - id: known_gene_biallelic
    epcr: 0.90
    finding_type: primary
    label: known MVA gene, biallelic (hom-alt)
  - id: known_gene_comphet
    epcr: 0.75
    finding_type: primary
    label: known MVA gene, candidate compound-het (unphased)
  - id: known_gene_monoallelic
    epcr: 0.35
    finding_type: primary
    label: known MVA gene, single rare protein-altering allele
  - id: phenotype_novel_gene
    epcr: 0.20
    finding_type: primary
    label: phenotype-driven candidate outside the known-gene panel
  - id: alt_representation
    epcr: 0.15
    finding_type: secondary
    label: alternate zygosity representation of a primary candidate
  - id: incidental
    epcr: 0.05
    finding_type: secondary
    label: incidental / weak phenotype support

# An Exomiser candidate outside the known-gene panel only reaches the
# phenotype_novel_gene tier at or above this combined score; everything else
# is reported as incidental (secondary).
phenotype_novel_gene_min_score: 0.70

# Hard cap from the submission schema. Kept here so the writer and the
# validator agree on one number.
max_rows: 10

# --- M3 lens mode (opt-in via MVA_LENS_MODE=1) ------------------------------
# These keys are read ONLY by the M3 lens agents (lens fan-out + refute gate +
# lens reconciler in agents/pipeline.ag). They are additive: the baseline
# reconciler never reads them, so lens mode leaves the baseline submission
# byte-for-byte identical. Editing them changes the lens submission ordering
# the same way the tier values above change the baseline ordering.
#
# lens_score_threshold      — a per-candidate lens score at or above this counts
#                             as that lens "agreeing" the candidate is causal.
# lens_agreement_promote_min — when at least this many of the five lenses agree,
#                             the candidate is PROMOTED one rung up the ladder
#                             above (comphet -> biallelic, monoallelic ->
#                             comphet, ...). Refutation (below) demotes instead.
# benign_population_af       — the refute gate's benign-in-population cutoff: a
#                             candidate whose representative variant carries a
#                             population allele frequency at or above this is a
#                             common (non-penetrant) allele and is REFUTED out of
#                             the ranked submission into refuted.tsv. 0.01 is the
#                             conventional common-variant (BA1-style) threshold.
lens_score_threshold: 0.6
lens_agreement_promote_min: 3
benign_population_af: 0.01

# INFO tag carrying the POPULATION allele frequency for the benign axis.
# MUST have population semantics: a raw caller VCF's INFO/AF is the SAMPLE's
# allele fraction (~0.5 on every het) and reading it as a population
# frequency refutes every real candidate (#2056). When the configured tag is
# absent from the VCF, the hard axis is skipped and the LLM skeptic considers
# population commonness from its own knowledge (candidate KEPT + tagged when
# unrefuted — the L4 fail-open contract).
benign_af_info_tag: GNOMAD_AF
