# Planning Colony Configuration
#
# Part of the Dev Apprenticeship federation.
# Copy to colony.toml and edit for your environment.

[colony]
name = "planning"
tick_interval_ms = 60000

[planning]
# GitLab label that marks an issue as ready for planning. The 4 planning
# agents only look at issues carrying this label. Default preserves the
# pre-#223 behavior; override to match the target project's workflow
# taxonomy (e.g. "DEV::not started" on projects using scoped labels).
# Scoped labels and spaces are supported — `--data-urlencode` handles
# encoding at the API layer.
trigger_label = "needs-planning"

# #226: label vocabulary injected into risk_assessor and task_decomposer
# prompts. Free-text; the agents splice the value into their prompt
# verbatim so operators can list comma-separated label names or describe
# non-label patterns (e.g. `"umbrella-issue pattern, parent/child refs"`).
# Leave unset to keep the pre-#226 hardcoded defaults
# ('incident, bug, blocker' and 'epic').
[planning.labels]
incident = "incident, bug, blocker"   # labels risk_assessor treats as incident-class
epic = "epic"                          # labels/patterns task_decomposer treats as epic-class

[gitlab]
url = "https://gitlab.example.com"
token = "glpat-your-token-here"
project = "your-org/your-project"
me = ""  # your GitLab username, e.g. "martin.holy" (optional, enables personal/team tagging)

[llm]
# Only "backend" is read today. "cli" uses the agentis daemon default CLI adapter.
backend = "cli"

# Agent definitions
# Each agent runs as a separate agentis daemon process.
# They discover each other via colony UDP and communicate over TCP emit/listen.

[[agents]]
name = "scope_estimator"
source = "agents/scope_estimator.ag"
cb_budget = 500
tick_interval_ms = 60000

[[agents]]
name = "risk_assessor"
source = "agents/risk_assessor.ag"
cb_budget = 500
tick_interval_ms = 60000

[[agents]]
name = "task_decomposer"
source = "agents/task_decomposer.ag"
cb_budget = 500
tick_interval_ms = 60000

[[agents]]
name = "plan_reviewer"
source = "agents/plan_reviewer.ag"
cb_budget = 600
tick_interval_ms = 60000
