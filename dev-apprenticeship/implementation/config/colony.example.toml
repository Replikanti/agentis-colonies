# Implementation Colony Configuration
#
# Part of the Dev Apprenticeship federation.
# Copy to colony.toml and edit for your environment.

[colony]
name = "implementation"
tick_interval_ms = 60000

# Forge backend selection (ADR-0002, #256). `type` picks which of the
# per-backend blocks below is active. Legal values: "gitlab", "github".
# The legacy top-level [gitlab] section was retired in PR 7 of #256
# (MAJOR bump). Operators on pre-#256 configs: move your url/token/
# project/me keys into [forge.gitlab] and set [forge].type = "gitlab".
[forge]
type = "gitlab"

[forge.gitlab]
url            = "https://gitlab.example.com"
token          = "glpat-your-token-here"
project        = "your-org/your-project"
me             = ""      # your GitLab username (optional)
default_branch = "main"  # primary branch (#224)

# [forge.github]
# owner          = "your-org-or-user"
# repo           = "your-repo"
# token          = "ghp_your-token-here"
# me             = ""      # your GitHub username (optional)
# default_branch = "main"  # primary branch

[implementation]
# GitLab label used to filter issues that are ready for implementation work.
# Leave unset (or as default) to use "implementation". Override when your
# project's workflow taxonomy uses a different or scoped label, e.g.
# "DEV::in progress". Scoped labels and labels with spaces are handled
# via --data-urlencode at the gitlab-api.sh layer. (#225)
trigger_label = "implementation"

[llm]
# Only "backend" is read today. "cli" uses the agentis daemon default CLI adapter.
backend = "cli"

# Agent definitions
# Each agent runs as a separate agentis daemon process.
# They discover each other via colony UDP and communicate over TCP emit/listen.

[[agents]]
name = "code_writer"
source = "agents/code_writer.ag"
cb_budget = 2000
tick_interval_ms = 60000

[[agents]]
name = "test_writer"
source = "agents/test_writer.ag"
cb_budget = 1500
tick_interval_ms = 60000

[[agents]]
name = "refactorer"
source = "agents/refactorer.ag"
cb_budget = 1000
tick_interval_ms = 60000

[[agents]]
name = "commit_composer"
source = "agents/commit_composer.ag"
cb_budget = 600
tick_interval_ms = 60000
