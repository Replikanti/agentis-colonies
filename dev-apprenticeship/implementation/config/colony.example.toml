# Implementation Colony Configuration
#
# Part of the Dev Apprenticeship federation.
# Copy to colony.toml and edit for your environment.

[colony]
name = "implementation"
tick_interval_ms = 60000
# Per-tick cognitive-budget cap (#1115). Splices `--cb-per-tick <n>` onto every
# `agentis daemon` launch so a single runaway tick cannot burn the whole budget
# in one pass. This colony-wide value is the default for every agent; override
# it per agent with a `cb_per_tick` key inside that agent's `[[agents]]` entry.
# Left unset, start-colony.sh falls back to 2000 (matching `daemon.cb_per_tick`
# in `<fed>/.agentis/config` written by install.sh).
# cb_per_tick = 2000

# Forge backend selection (ADR-0002, #256). `type` picks which of the
# per-backend blocks below is active. Legal values: "gitlab", "github".
# The legacy top-level [gitlab] section was retired in PR 7 of #256
# (MAJOR bump). Operators on pre-#256 configs: move your url/token/
# project/me keys into [forge.gitlab] and set [forge].type = "gitlab".
[forge]
type = "gitlab"

[forge.gitlab]
url            = "https://gitlab.example.com"
token          = "glpat-your-token-here"
project        = "your-org/your-project"
me             = ""      # your GitLab username (optional)
default_branch = "main"  # primary branch (#224)

# [[forge.github]]
# url            = "https://api.github.com"  # optional; override for GitHub Enterprise
# owner          = "your-org-or-user"
# repo           = "your-repo"
# token          = "ghp_your-token-here"
# me             = ""      # your GitHub username (optional)
# default_branch = "main"  # primary branch
#
# To serve N repos from this colony, repeat the [[forge.github]] block once
# per repo. Each entry has its own owner/repo/token/url/me.

[implementation]
# GitLab label used to filter issues that are ready for implementation work.
# Leave unset (or as default) to use "implementation". Override when your
# project's workflow taxonomy uses a different or scoped label, e.g.
# "DEV::in progress". Scoped labels and labels with spaces are handled
# via --data-urlencode at the gitlab-api.sh layer. (#225)
trigger_label = "implementation"
# When false (default), code_writer's action path also fires on labeled-but-
# unassigned issues — the label alone is a strong enough intent signal, and
# most repos don't self-assign issues until a contributor picks them up. Set
# to true to restore the pre-#291 contributor-hand-off gating (issue must be
# both labeled AND assigned). (#291)
require_assignee = false

# #1354: caller-driven edit loop. When true (the DEFAULT since step 3),
# code_writer.ag drives the attempt/continuation/verify/finalize state machine
# ITSELF over the --one-attempt / --reuse / --finalize primitives, instead of
# delegating the whole loop to code-edit-in-checkout.sh's in-shell multi-attempt
# loop — the #1354 migration (loop logic in the .ag, the shell a thin
# per-invocation primitive). Set to false to fall back to the in-shell loop for
# every issue. Note: epic-class issues (--decompose) always use the in-shell
# path regardless, until decomposition is migrated into the .ag (see #1353).
# Exported to the daemon as AG_DRIVEN_EDIT_LOOP (read via getenv); an absent key
# resolves to ON, only an explicit false/0/no/off opts out.
ag_driven_edit_loop = true

# Per-colony LLM backend override (#319, schema reserved for forward-
# compat — NO RUNTIME EFFECT today; see #351). All four keys are
# OPTIONAL — when absent, the agent inherits the federation-wide default
# from `<fed>/.agentis/config`. The original plan was for start-colony.sh
# to splice each set key onto `agentis daemon` as
# `--config-override llm.<key>=<value>`, but `agentis daemon` does not
# accept `--config-override` as of agentis 1.4.7 — emitting it crashes
# every respawn. The splice is disabled in #351; this block is parsed and
# ignored at runtime until the upstream binary ships the flag. Cost-cap
# downgrade (`<fed>/.agentis/llm-backend-override`) is also reduced to
# documentation-only until then.
#
# Operators: leaving these keys set is harmless; do not rely on them yet.
# Forward-compat / inert per #351: this block is parsed but has NO RUNTIME
# EFFECT today. The REAL backend lives in `<fed>/.agentis/config` (set by
# install.sh §6). install.sh wires the default CLI = the flat-cyborg PTY
# wrapper over Claude Code.
[llm]
# "cli" = inherit the agentis daemon default (the federation backend in
# .agentis/config — flat-cyborg, set by install.sh). Do NOT hardcode a
# specific backend here: this [llm] block is inert per #351 (the daemon
# reads .agentis/config) so hardcoding would only mislead. See the
# "LLM backend" section in CLAUDE.md.
backend = "cli"
# command = "claude"
# model = "claude-sonnet-4"
# api_key_env = "ANTHROPIC_API_KEY"

# Agent definitions
# Each agent runs as a separate agentis daemon process.
# They discover each other via colony UDP and communicate over TCP emit/listen.

[[agents]]
name = "code_writer"
source = "agents/code_writer.ag"
cb_budget = 3000
tick_interval_ms = 60000

[[agents]]
name = "test_writer"
source = "agents/test_writer.ag"
cb_budget = 1500
tick_interval_ms = 60000

[[agents]]
name = "refactorer"
source = "agents/refactorer.ag"
cb_budget = 1000
tick_interval_ms = 60000

[[agents]]
name = "commit_composer"
source = "agents/commit_composer.ag"
cb_budget = 600
tick_interval_ms = 60000
