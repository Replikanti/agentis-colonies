# Release Colony Configuration
#
# Part of the Dev Apprenticeship federation.
# Copy to colony.toml and edit for your environment.

[colony]
name = "release"
tick_interval_ms = 60000

# Forge backend selection (ADR-0002, #256). `type` picks which of the
# per-backend blocks below is active. Legal values: "gitlab", "github".
# The legacy top-level [gitlab] section was retired in PR 7 of #256
# (MAJOR bump). Operators on pre-#256 configs: move your url/token/
# project/me keys into [forge.gitlab] and set [forge].type = "gitlab".
[forge]
type = "gitlab"

[forge.gitlab]
url            = "https://gitlab.example.com"
token          = "glpat-your-token-here"
project        = "your-org/your-project"
me             = ""      # your GitLab username (optional)
default_branch = "main"  # primary branch (#224)

# [[forge.github]]
# url            = "https://api.github.com"  # optional; override for GitHub Enterprise
# owner          = "your-org-or-user"
# repo           = "your-repo"
# token          = "ghp_your-token-here"
# me             = ""      # your GitHub username (optional)
# default_branch = "main"  # primary branch
#
# To serve N repos from this colony, repeat the [[forge.github]] block once
# per repo. Each entry has its own owner/repo/token/url/me.

# Per-colony LLM backend override (#319, schema reserved for forward-
# compat — NO RUNTIME EFFECT today; see #351). All four keys are
# OPTIONAL — when absent, the agent inherits the federation-wide default
# from `<fed>/.agentis/config`. The original plan was for start-colony.sh
# to splice each set key onto `agentis daemon` as
# `--config-override llm.<key>=<value>`, but `agentis daemon` does not
# accept `--config-override` as of agentis 1.4.7 — emitting it crashes
# every respawn. The splice is disabled in #351; this block is parsed and
# ignored at runtime until the upstream binary ships the flag. Cost-cap
# downgrade (`<fed>/.agentis/llm-backend-override`) is also reduced to
# documentation-only until then.
#
# Operators: leaving these keys set is harmless; do not rely on them yet.
[llm]
backend = "cli"
# command = "claude"
# model = "claude-sonnet-4"
# api_key_env = "ANTHROPIC_API_KEY"

# Agent definitions
# Each agent runs as a separate agentis daemon process.
# They discover each other via colony UDP and communicate over TCP emit/listen.

[[agents]]
name = "ship_decider"
source = "agents/ship_decider.ag"
cb_budget = 600
tick_interval_ms = 60000

[[agents]]
name = "changelog_writer"
source = "agents/changelog_writer.ag"
cb_budget = 800
tick_interval_ms = 60000

[[agents]]
name = "version_bumper"
source = "agents/version_bumper.ag"
cb_budget = 400
tick_interval_ms = 60000

[[agents]]
name = "release_checker"
source = "agents/release_checker.ag"
cb_budget = 800
tick_interval_ms = 60000
