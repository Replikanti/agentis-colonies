# Code Review Colony Configuration
#
# Part of the Dev Apprenticeship federation.
# Copy to colony.toml and edit for your environment.

[colony]
name = "code-review"
tick_interval_ms = 60000

# Forge backend selection (ADR-0002, #256). `type` picks which of the
# per-backend blocks below is active. Legal values: "gitlab", "github".
# The legacy top-level [gitlab] section was retired in PR 7 of #256
# (MAJOR bump). Operators on pre-#256 configs: move your url/token/
# project/me keys into [forge.gitlab] and set [forge].type = "gitlab".
[forge]
type = "gitlab"

[forge.gitlab]
url     = "https://gitlab.example.com"
token   = "glpat-your-token-here"
project = "your-org/your-project"
me      = ""  # your GitLab username (optional, enables personal/team tagging)

# [forge.github]
# url   = "https://api.github.com"  # optional; override for GitHub Enterprise
# owner = "your-org-or-user"
# repo  = "your-repo"
# token = "ghp_your-token-here"
# me    = ""  # your GitHub username (optional)

# Per-colony LLM backend override (#319, PR 1 of 5). All four keys are
# OPTIONAL — when absent, the agent inherits the federation-wide default
# from `<fed>/.agentis/config`. When any key is set, start-colony.sh
# splices it onto every `agentis daemon` invocation as
# `--config-override llm.<key>=<value>`. Legal `backend` values: `mock`,
# `cli`, `http`. `command` is consumed by the `cli` backend; `model`
# and `api_key_env` are consumed by the `http` backend. The cost-cap
# downgrade override file (`<fed>/.agentis/llm-backend-override`)
# takes precedence over this block — see CHANGELOG.
[llm]
backend = "cli"
# command = "claude"
# model = "claude-sonnet-4"
# api_key_env = "ANTHROPIC_API_KEY"

# Agent definitions
# Each agent runs as a separate agentis daemon process.
# They discover each other via colony UDP and communicate over TCP emit/listen.

[[agents]]
name = "style_reviewer"
source = "agents/style_reviewer.ag"
cb_budget = 600
tick_interval_ms = 60000

[[agents]]
name = "logic_reviewer"
source = "agents/logic_reviewer.ag"
cb_budget = 1000
tick_interval_ms = 60000

[[agents]]
name = "security_reviewer"
source = "agents/security_reviewer.ag"
cb_budget = 800
tick_interval_ms = 60000

[[agents]]
name = "test_reviewer"
source = "agents/test_reviewer.ag"
cb_budget = 800
tick_interval_ms = 60000

[[agents]]
name = "approval_decider"
source = "agents/approval_decider.ag"
cb_budget = 600
tick_interval_ms = 60000
