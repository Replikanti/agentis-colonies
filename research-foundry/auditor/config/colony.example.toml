# Auditor Colony Configuration
#
# Part of the Claim Auditor federation. Reads the four searcher
# reports from memo, runs a single Opus-class LLM call to synthesize
# a VERIFIED_NEW / KNOWN_PRIOR / NEEDS_HUMAN verdict, and writes the
# row to audit-ledger.jsonl. Does not touch any external API.
#
# Copy to colony.toml and edit for your environment.

[colony]
name = "auditor"
tick_interval_ms = 90000

# Non-forge federation (#373, ADR-0003). The auditor writes only to a
# local JSONL ledger via DISCOVERY_LEDGER env, not to any forge.
[forge]
type = "none"

[llm]
# Only "backend" is read today. "flat-cyborg" = flat-rate Claude via the
# PTY wrapper (#1138). The run-research.sh orchestrator overlays the real
# [llm.flat_cyborg] + per-tier block in the container bootstrap; the
# auditor is a terminal-writer, so it pins claude-opus-4-8 via the
# agents.auditor.llm.model per-agent override.
backend = "flat-cyborg"

[auditor]
confidence_floor = 0.7

[[agents]]
name = "auditor"
source = "agents/auditor.ag"
cb_budget = 2000000000
tick_interval_ms = 90000
