# Explorer Colony Configuration
#
# Part of the Math Foundry federation. The explorer colony emits Python
# code from the LLM, executes it in the hermetic sandbox via `exec sh`,
# captures stdout, and writes the (code, output) pair to memo for the
# downstream noticer / formulator / verifier / novelty chain. Copy to
# colony.toml and edit for your environment.

[colony]
name = "explorer"
tick_interval_ms = 60000

# math-foundry is a non-forge federation (ADR-0003). Explorations run
# inside the sandbox container spawned by `tools/run-foundry.sh`; no
# agent calls a forge API. `forge.type = "none"` opts out of the forge
# contract without requiring a [forge.gitlab] / [forge.github] sub-block.
[forge]
type = "none"

[llm]
# Only "backend" is read today. "cli" uses the agentis daemon default CLI
# adapter. The foundry orchestrator (`tools/run-foundry.sh`) overlays a
# proper [llm.openai] block in the container bootstrap.
backend = "cli"

# Agent definitions
# Each agent runs as a separate agentis daemon process. They discover
# each other via colony UDP and communicate over TCP emit/listen.

[[agents]]
name = "explorer"
source = "agents/explorer.ag"
cb_budget = 2000000000
tick_interval_ms = 60000

# Economy knobs. Operator override path: edit env vars before launching
# scripts/start-colony.sh (INITIAL_CB, BASE_COST, K_MALTHUSIAN,
# MAX_REPLICAS, REPRODUCTIVE_FITNESS_THRESHOLD). The values below match
# the script defaults — they are documentation only and are NOT read by
# start-colony.sh today.

[colony.replication]
enabled = true
initial_cb = 1000
base_cost = 100
k_malthusian = 3
max_replicas = 5

[colony.reproductive]
fitness_threshold = 100
