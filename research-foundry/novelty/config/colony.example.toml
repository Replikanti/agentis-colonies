# Novelty Colony Configuration
#
# Part of the Math Foundry federation. The novelty colony reads the
# verifier's ACCEPT-ed problem and runs a strict NOVELTY_PROMPT that
# defaults to NOT_NOVEL unless the answer requires genuine computation
# and is not a famous constant. Copy to colony.toml and edit for your
# environment.

[colony]
name = "novelty"
tick_interval_ms = 60000

# math-foundry is a non-forge federation (ADR-0003).
[forge]
type = "none"

[llm]
# Only "backend" is read today. The run-research.sh orchestrator
# overlays the real [llm.flat_cyborg] + per-tier block in the
# container bootstrap. "flat-cyborg" = flat-rate Claude via the
# PTY wrapper (#1138).
backend = "flat-cyborg"

[[agents]]
name = "novelty"
source = "agents/novelty.ag"
cb_budget = 2000000000
tick_interval_ms = 60000
