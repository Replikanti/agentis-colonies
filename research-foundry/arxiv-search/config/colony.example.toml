# Arxiv Search Colony Configuration
#
# Part of the Claim Auditor federation. Phase-1 single-agent colony
# that hits the public arXiv API (no auth) to find prior work for the
# upstream math-foundry novelty claim seeded into memo by
# tools/run-auditor.sh.
#
# Copy to colony.toml and edit for your environment.

[colony]
name = "arxiv-search"
tick_interval_ms = 120000

# Non-forge federation (#373, ADR-0003). arXiv is a read-only HTTPS
# data source, not a forge; no [forge.gitlab] / [forge.github] block.
[forge]
type = "none"

[llm]
# Only "backend" is read today. "cli" uses the agentis daemon default
# CLI adapter. tools/run-auditor.sh overlays a proper llm.command /
# llm.args block in the container bootstrap when
# AUDITOR_LLM_BACKEND=claude.
backend = "cli"

# Agent-specific knobs read at startup via env var (ARXIV_MAX_QUERY_RESULTS).
[arxiv_search]
max_query_results = 10

[[agents]]
name = "arxiv-search"
source = "agents/arxiv-search.ag"
cb_budget = 2000
tick_interval_ms = 120000
