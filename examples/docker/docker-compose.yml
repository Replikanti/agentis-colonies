# Sample docker-compose for the dev-apprenticeship federation (#324).
#
# Single service, persistent volume for /data, env file for forge creds.
# Pin the image tag before using in production — `dev-apprenticeship-latest`
# is for dev only.

services:
  federation:
    image: ghcr.io/replikanti/agentis-colonies:dev-apprenticeship-1.2.0
    container_name: agentis-colonies
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - agentis-data:/data
    healthcheck:
      test: ["CMD", "agentis", "daemon", "list"]
      interval: 60s
      timeout: 10s
      start_period: 30s
      retries: 3

volumes:
  agentis-data:
