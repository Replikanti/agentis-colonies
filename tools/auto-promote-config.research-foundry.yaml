# auto-promote-config.research-foundry.yaml — Decision rules for the
# consolidated research-foundry federation (#638).
#
# Replaces three retired per-fed configs:
#   - auto-promote-config.math-foundry.yaml
#   - auto-promote-config.claim-auditor.yaml
#   - auto-promote-config.preprint-foundry.yaml
#
# Picks the most lenient prerequisites among the three retired feds
# (preprint-foundry's 10 acting entries + 1.5h runtime). Until
# `auto-promote-decisions.py` grows per-colony override blocks, this
# single config applies uniformly to all 15 colonies. The fastest-
# producing math colonies (explorer / formulator) that today auto-
# promoted at 0.5h are gated at 1.5h here, accepting a slower ramp in
# exchange for a single sidecar pass. Per-colony prereq variation is
# deferred as a Phase 2 chore.
#
# `dry_run: true` is preserved — flip in a follow-up PR once the
# journal shows the sidecar making sensible decisions on a real run.

promote:
  prerequisites:
    min_entries: 30
    min_acting_entries: 10
    min_runtime_hours: 1.5
    reject_rate_threshold: 0.10
    delta_slope_window: 20
    delta_slope_min: 0
  steps:
    - from: 0.4
      to: 0.6
      min_acting_entries_override: 0
    - from: 0.6
      to: 0.8
    - from: 0.8
      to: 0.95
      min_acting_entries_override: 30

evolve:
  trigger:
    delta_slope_negative_for: 1000
    reject_rate_above: 0.20
  config:
    generations: 3
    population: 4
    weights: "cb,val,exp"

dry_run: true
