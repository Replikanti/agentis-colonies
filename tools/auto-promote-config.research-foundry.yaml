# auto-promote-config.research-foundry.yaml — Decision rules for the
# consolidated research-foundry federation (#638).
#
# Replaces three retired per-fed configs:
#   - auto-promote-config.math-foundry.yaml
#   - auto-promote-config.claim-auditor.yaml
#   - auto-promote-config.preprint-foundry.yaml
#
# Picks the most lenient prerequisites among the three retired feds
# (preprint-foundry's 10 acting entries + 1.5h runtime). Until
# `auto-promote-decisions.py` grows per-colony override blocks, this
# single config applies uniformly to all 15 colonies. The fastest-
# producing math colonies (explorer / formulator) that today auto-
# promoted at 0.5h are gated at 1.5h here, accepting a slower ramp in
# exchange for a single sidecar pass. Per-colony prereq variation is
# deferred as a Phase 2 chore.
#
# Phase 7 PR-C (#628) flips `evolve.dry_run` and
# `evolve.mutation.enabled` for the explorer agent only -- the
# `evolve.mutation.allowed_agents: ["explorer"]` gate keeps the other
# 14 agents in observe-only mode through the legacy `agentis evolve`
# path. Explorer cull/evolve plus lifecycle-on-default (#663, #679)
# are the maturity context for flipping the top-level gate next.
#
# Top-level `dry_run: false` (flipped per #717): Run #14 forensic
# showed all 18 roles stuck at the install seed 0.7 (propose tier)
# because the sidecar evaluated promote decisions every 5 minutes but
# never applied them. Per ADR-0001 the propose tier silently disables
# the auditor's audit-ledger writes, blocking the late-pipeline state
# advance. The remaining safety net is layered downstream and is NOT
# the top-level gate:
#   - Auditor propose-tier guard (`final_write=false`) suppresses
#     audit-ledger rows until a role is promoted past propose, so
#     pre-promote auditors stay silent.
#   - Submitter only acts terminally at the autonomous tier AND
#     requires an operator-set `reviewer:<claim>:approved` memo key.
#   - `RESEARCH_ARXIV_GATEWAY` is HItL-only per the orchestrator log;
#     the terminal arXiv send is never auto-dispatched.

promote:
  prerequisites:
    min_entries: 30
    min_acting_entries: 10
    # min_runtime_hours relaxed from 1.5 to 1.0 (#718): the binding
    # constraint is min_entries=30, which at the auditor's empirical
    # 12 acting-rows/h needs 2.5h to clear. Paired with the
    # RESEARCH_TOTAL_TICKS default bump from 30 to 75 (also #718), the
    # default run now provides a 2.5h budget, so 1.0h is sufficient
    # as a sanity guard against premature promotion without becoming
    # the binding gate itself.
    min_runtime_hours: 1.0
    reject_rate_threshold: 0.10
    delta_slope_window: 20
    delta_slope_min: 0
  steps:
    - from: 0.4
      to: 0.6
      min_acting_entries_override: 0
    - from: 0.6
      to: 0.8
    - from: 0.8
      to: 0.95
      min_acting_entries_override: 30

evolve:
  trigger:
    delta_slope_negative_for: 1000
    reject_rate_above: 0.20
    both_signals_required: false        # false=OR (legacy), true=AND
  config:
    generations: 3
    population: 4
    weights: "cb,val,exp"
  mutation:
    enabled: true                        # PR-C flips ON — gated per agent below
    allowed_agents: ["explorer"]         # PR-C: explorer is the only agent in live evolve mode
    max_concurrent_per_colony: 1         # throttle: max open candidates per colony
    max_generations: 10                  # 10-gen cap per #628 acceptance
    skip_tiers: ["autonomous"]           # do not evolve autonomous-tier agents
  ab:
    ticks: 50                            # K-tick A/B window
    min_acting_for_decision: 10
    min_delta: 0.05                      # candidate must beat parent by this fraction
    fast_mode_ticks: 10                  # for smoke tests
    absolute_max_wait_s: 1800            # PR-B (#628): hard cap on A/B wait
  archive_dir: "evolution-archive"
  ledger_path: "evolution-ledger.jsonl"
  dry_run: false                         # PR-C flips live for explorer (#628)

dry_run: false
