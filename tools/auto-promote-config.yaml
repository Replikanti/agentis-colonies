# auto-promote-config.yaml — Decision rules for auto-promote / auto-evolve
#
# Used by tools/auto-promote.sh. See doc/auto-promote.md for full reference
# (DMN decision table, per-step rationale, journal format).
#
# All thresholds are per-agent: the script evaluates each running agent
# independently against these rules.

promote:
  prerequisites:
    # Calibrated for finite-run research windows (75-tick × 60s ≈ 75 min)
    # AND multi-day production deployments. Pre-#799 the thresholds were
    # sized for the latter only (min_entries=200, min_acting_entries=60,
    # min_runtime_hours=48), which made the autonomous tier structurally
    # unreachable inside a single research-foundry run — the substrate
    # primitives gated on autonomous (replicate, evolve_self, knowledge_sell
    # pre-#792, _publish_*'s autonomous-only ledger writes, auditor #761
    # audit-guard decide()) were dead code paths in practice. The per-step
    # `min_acting_entries_override` for review-gated → autonomous (line ~41)
    # preserves the safety semantics for the riskiest promotion by raising
    # the acting-entry requirement back to a rule-of-three-derived value.
    min_entries: 30                # total experience rows (any tag)
    min_acting_entries: 10         # acting rows only — see doc/auto-promote.md#formula
    min_runtime_hours: 0.5         # 30 min minimum (was 48h — incompatible with finite-run windows)
    reject_rate_threshold: 0.05    # reject_rate on acting rows must be < 5%
    delta_slope_window: 20         # compute slope over last N acting rows
    delta_slope_min: 0             # average delta must be non-negative
  # Three-step ladder aligned with the four-tier confidence contract
  # (ADR-0001, issue #177). Each step promotes the agent across one
  # behavioural tier boundary: shadow -> propose -> review-gated ->
  # autonomous. Numeric anchors match the tier lower bounds defined in
  # ADR-0001; do not adjust independently.
  #
  # Per-step overrides (min_acting_entries_override) replace the global
  # prerequisite for that step. See doc/auto-promote.md#per-step-rationale
  # for derivation.
  steps:
    - from: 0.4   # shadow seed
      to: 0.6     # promote to propose (emit + draft external writes)
      # Bootstrap: shadow tier has no acting branch (.ag gates acting on
      # tier == "propose" or higher). An agent at 0.4 has acting_entries
      # = 0 by construction, so require 0 to unblock the first promotion.
      min_acting_entries_override: 0
    - from: 0.6   # propose
      to: 0.8     # promote to review-gated (direct non-terminal writes)
      # Uses global min_acting_entries (60).
    - from: 0.8   # review-gated
      to: 0.95    # promote to autonomous (terminal writes)
      # Autonomous is riskier (no review gate on direct writes). Halve
      # the tolerable reject rate: apply rule-of-three to 0.025 instead
      # of 0.05, giving ceil(3 / 0.025) = 120 in the pre-#799 sizing.
      # Re-scaled to 30 alongside the global threshold cut (#799) so
      # autonomous tier is reachable in finite-run windows; the
      # rule-of-three derivation now reads as `ceil(3 / 0.1) = 30`
      # against a 10% target reject rate, which is still strictly
      # tighter than the global 5% prereq (the autonomous gate
      # therefore still requires fewer total errors than the loose
      # propose→review-gated step).
      min_acting_entries_override: 30

evolve:
  trigger:
    delta_slope_negative_for: 1000  # negative slope on acting rows sustained over N entries
    reject_rate_above: 0.20         # OR reject_rate on acting rows > 20%
  config:
    generations: 3
    population: 4
    weights: "cb,val,exp"

# dry_run: true means all actions are logged but not executed.
# Default is true — flip to false only after reviewing the journal.
dry_run: true
