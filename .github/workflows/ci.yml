name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  colony-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck (required by colony-lint)
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      # #2372: the exam self-test (colony-lint -> demo-holdout-exam.sh) runs exam-guard.ag through a real agentis
      # binary, and on CI a missing binary FAILS it. This installs the LATEST storefront release (the release
      # install.sh and `agentis update` fetch; no version or hash pinned here), checked against that release's own
      # published sha256, OUTSIDE PATH: only EXAM_GUARD_AGENTIS sees it, so the checks that skip without agentis
      # on PATH stay unchanged. #2374: every deep invariant cell runs cell-scope.ag through the same binary, as
      # DF_CELL_SCOPE_AGENTIS (tools/test-deep-cell-scope.sh FAILS on CI without it).
      - name: Install agentis for the exam guard (latest release, sha256-checked, outside PATH)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          d="$RUNNER_TEMP/agentis"
          mkdir -p "$d"
          cd "$d"
          gh release download -R Replikanti/agentis -p agentis-linux-x86_64 -p agentis-linux-x86_64.sha256
          sha256sum -c agentis-linux-x86_64.sha256
          mv agentis-linux-x86_64 agentis
          chmod +x agentis
          ./agentis --version
          echo "EXAM_GUARD_AGENTIS=$d/agentis" >> "$GITHUB_ENV"
          echo "DF_CELL_SCOPE_AGENTIS=$d/agentis" >> "$GITHUB_ENV"

      # The ubuntu-26.04 runner ships uutils coreutils, whose `timeout` is not GNU: exam.sh refuses to run there and
      # the held-out exam self-test (#2262, #2372) never ran on CI. Swap in GNU coreutils; demo-holdout-exam.sh
      # FAILS on CI when a prerequisite of the exam self-test is missing, so this step cannot silently regress.
      - name: Switch to GNU coreutils (the exam self-test needs GNU timeout)
        run: |
          set -eu
          sudo apt-get install -y --allow-remove-essential coreutils-from-gnu coreutils-from-uutils-
          v="$(timeout --version | head -1)"
          echo "timeout --version: $v"
          case "$v" in *"GNU coreutils"*) ;; *) echo "timeout is still not GNU coreutils" >&2; exit 1 ;; esac

      - name: Run colony-lint
        run: ./tools/colony-lint.sh
