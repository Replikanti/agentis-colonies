name: Release docker

# Tag-triggered multi-arch container image build (#324). Fires on the same
# `dev-apprenticeship-v*` tags as `release.yml`. Mirrors that workflow's
# auth + parsing pattern (parse FED + VER from the tag name, use the
# repository's GITHUB_TOKEN for GHCR auth).
#
# Output: ghcr.io/<owner>/<repo>:dev-apprenticeship-<X.Y.Z>
#         ghcr.io/<owner>/<repo>:dev-apprenticeship-latest
# Platforms: linux/amd64, linux/arm64.

on:
  push:
    tags:
      - 'dev-apprenticeship-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Federation tag to build (e.g. dev-apprenticeship-v1.2.0)'
        required: true
        default: 'dev-apprenticeship-v1.2.0'

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout at tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # workflow_dispatch passes the tag explicitly so we can run a
          # rebuild without cutting a new release. push events default to
          # the ref that triggered the workflow.
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Parse federation + version from tag
        id: tag
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          FED="${TAG%-v*}"
          VER="${TAG##*-v}"
          {
            echo "tag=$TAG"
            echo "fed=$FED"
            echo "ver=$VER"
          } >> "$GITHUB_OUTPUT"
          echo "Parsed: federation='$FED', version='$VER' from tag '$TAG'"

      - name: Read agentis-version pin
        id: pin
        run: |
          PIN_FILE="${{ steps.tag.outputs.fed }}/.agentis-version"
          if [ -f "$PIN_FILE" ]; then
            AGENTIS_VERSION="$(tr -d '[:space:]' < "$PIN_FILE")"
          else
            echo "[!!] $PIN_FILE missing — falling back to Dockerfile default" >&2
            AGENTIS_VERSION=""
          fi
          echo "agentis_version=$AGENTIS_VERSION" >> "$GITHUB_OUTPUT"
          echo "Pinned agentis runtime: ${AGENTIS_VERSION:-<dockerfile default>}"

      # IMAGE name is owner/repo lowercased — GHCR rejects mixed case.
      - name: Compute image name
        id: img
        run: |
          OWNER="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          REPO="$(echo '${{ github.event.repository.name }}' | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${OWNER}/${REPO}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU (multi-arch emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.img.outputs.image }}:${{ steps.tag.outputs.fed }}-${{ steps.tag.outputs.ver }}
            ${{ steps.img.outputs.image }}:${{ steps.tag.outputs.fed }}-latest
          build-args: |
            AGENTIS_VERSION=${{ steps.pin.outputs.agentis_version }}
            FEDERATION_VERSION=${{ steps.tag.outputs.ver }}
          # Inline cache for faster rebuilds on the same workflow runner.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
