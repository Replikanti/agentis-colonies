# Monitor Colony Configuration
#
# Part of the Dark Factory federation. The monitor colony continuously WATCHES a
# target EVM protocol and emits reasoned, high-signal anomaly alerts on the
# colony bus (`monitor:alert`). NON-custodial / read-only: every watcher only
# READS chain state via `cast`/RPC; no agent signs a transaction or touches
# funds. Copy to colony.toml and edit for your environment.

[colony]
name = "monitor"
tick_interval_ms = 60000

# dark-factory is a non-forge federation (ADR-0003). The monitor watchers read
# on-chain state through `cast`/RPC inside the sandbox via `exec sh`; no agent
# calls a GitLab/GitHub forge API. `forge.type = "none"` is the explicit
# non-forge marker recognised by colony-lint — no [forge.gitlab] / [forge.github]
# sub-block is required. See ADR-0003 for the portability contract and ADR-0002
# for the forge-bound contract this opts out of.
[forge]
type = "none"

[llm]
# Only "backend" is read today. "cli" uses the agentis daemon default CLI
# adapter. The watchers' verdicts are deterministic on-chain reads (no LLM call
# on the hot path); the backend is declared for schema conformance + future
# reasoning extensions.
backend = "cli"

# Agent definitions. Each agent runs as a separate `agentis daemon` process,
# launched by scripts/start-colony.sh with a per-agent tick interval. They
# coordinate via durable memos (the `monitor:signal:*` blackboard) and emit over
# the bus. cb_budget MUST match the `cb <N>;` decl at the top of each .ag file.

# Evaluates derived protocol invariants against current on-chain state and flags
# a violation / margin-to-violation. Posts monitor:signal:invariant.
[[agents]]
name = "invariant-watcher"
source = "agents/invariant-watcher.ag"
cb_budget = 90000
tick_interval_ms = 60000

# Watches the price feed for deviation / staleness / out-of-bounds. Posts
# monitor:signal:oracle.
[[agents]]
name = "oracle-watcher"
source = "agents/oracle-watcher.ag"
cb_budget = 90000
tick_interval_ms = 60000

# Watches the governance / upgrade surface (EIP-1967 impl + admin slots,
# owner/admin view, role grants, timelock queue) and flags a CHANGE vs the
# learned baseline — the highest-value pre-exploit early-warning. Posts
# monitor:signal:governance.
[[agents]]
name = "governance-watcher"
source = "agents/governance-watcher.ag"
cb_budget = 90000
tick_interval_ms = 60000

# Watches a pool / vault reserve or TVL proxy and flags a drop beyond a learned
# band (sudden drain). Posts monitor:signal:liquidity.
[[agents]]
name = "liquidity-watcher"
source = "agents/liquidity-watcher.ag"
cb_budget = 90000
tick_interval_ms = 60000

# Watches net flow over a window and flags an abnormal outflow burst vs the
# previous window. Posts monitor:signal:flow.
[[agents]]
name = "flow-watcher"
source = "agents/flow-watcher.ag"
cb_budget = 90000
tick_interval_ms = 60000

# Watches the paused() / circuit-breaker boolean and flags a state transition
# (a protocol pausing itself is signal). Posts monitor:signal:pause.
[[agents]]
name = "pause-state-watcher"
source = "agents/pause-state-watcher.ag"
cb_budget = 90000
tick_interval_ms = 60000

# Fuses the watcher signals, dedups, decides severity, and emits one
# consolidated monitor:alert. Reads the monitor:signal:* blackboard.
[[agents]]
name = "coordinator"
source = "agents/coordinator.ag"
cb_budget = 120000
tick_interval_ms = 60000

# The bus->webhook BRIDGE (#1092): listens for monitor:alert and forwards each to
# scripts/notify.sh (the configured sink) so a page is actually delivered, not
# just emitted. Also owns the liveness HEARTBEAT and the dead-man's switch
# (#1093). Read-only / non-custodial (outbound notification only). Needs
# --enable-messaging (listen) + --enable-exec (notify.sh).
[[agents]]
name = "notifier"
source = "agents/notifier.ag"
cb_budget = 90000
tick_interval_ms = 60000

# Monitor environment contract (consumed by the agents via getenv; exported by
# scripts/start-colony.sh). Operators export these before launching, and add
# each to exec.env_passthrough in .agentis/config so the sandboxed `exec sh` can
# read them. All watchers degrade safely when their reader is unconfigured: with
# no MONITOR_CAST / MONITOR_RPC_URL they read nothing and only observe (no false
# alert).
#
# Shared (both watchers):
#   MONITOR_CAST            absolute path to the `cast` binary (foundry).
#   MONITOR_RPC_URL         the chain RPC endpoint cast reads from (read-only).
#
# invariant-watcher:
#   MONITOR_TARGET          the target protocol contract address (0x...).
#   MONITOR_INV_LHS_SIG     cast-call signature for the invariant's LHS quantity
#                           (e.g. "totalSupply()").
#   MONITOR_INV_RHS_SIG     cast-call signature for the RHS quantity (e.g.
#                           "totalAssets()"); "" => use MONITOR_INV_RHS_CONST.
#   MONITOR_INV_RHS_CONST   a literal integer RHS bound (used when RHS_SIG is "").
#   MONITOR_INV_REL         the relation that MUST hold: "le" | "ge" | "eq"
#                           (default "le", e.g. solvency: supply <= assets).
#   MONITOR_INV_MARGIN_BP   margin-to-violation band in basis points (0..10000);
#                           "" => 0 (only a hard violation flags).
#   MONITOR_INV_LABEL       a human label for the invariant (alert body).
#   MONITOR_INV_SPEC        (#1086) a DERIVED watch-spec for the WHOLE invariant
#                           SET — an absolute PATH to the JSON file
#                           run-live-watch.sh emits, or the JSON array INLINE. When
#                           set, the watcher evaluates EVERY invariant in the set
#                           each tick; when unset it uses the single MONITOR_INV_*
#                           invariant above (backward-compatible).
#
# oracle-watcher:
#   MONITOR_ORACLE          the price-feed contract address (0x...).
#   MONITOR_ORACLE_PRICE_SIG cast-call signature returning the price
#                           (default "latestAnswer()").
#   MONITOR_ORACLE_TS_SIG   signature returning the feed's last-update unix ts
#                           (e.g. "latestTimestamp()"); "" => skip staleness.
#   MONITOR_ORACLE_MAX_AGE  max feed age in seconds before STALENESS flags;
#                           "" => 0 (skip staleness).
#   MONITOR_ORACLE_DEV_BP   deviation band in basis points vs the last baseline;
#                           "" => 0 (skip deviation).
#   MONITOR_ORACLE_MIN      lower sanity bound on the price; "" => no lower bound.
#   MONITOR_ORACLE_MAX      upper sanity bound on the price; "" => no upper bound.
#   MONITOR_ORACLE_LABEL    a human label for the feed (alert body).
#
# governance-watcher (#1095) — flags a CHANGE vs the learned baseline:
#   MONITOR_GOV_TARGET      the governed proxy address (0x...); "" => MONITOR_TARGET.
#   MONITOR_GOV_OWNER_SIG   cast-call signature returning the owner/admin address
#                           (e.g. "owner()" / "admin()"); "" => skip the owner check
#                           (the two EIP-1967 proxy slots are always watched).
#   MONITOR_GOV_ROLE_SIG    cast-call signature returning a role-grant indicator
#                           (e.g. a member count for a fixed role); "" => skip.
#   MONITOR_GOV_TIMELOCK_SIG cast-call signature returning a timelock-queue
#                           indicator (queued-op count / pending-op id); "" => skip.
#   MONITOR_GOV_LABEL       a human label for the target (alert body).
#
# liquidity-watcher (#1096) — flags a reserve / TVL drop past a learned band:
#   MONITOR_LIQ_TARGET      the pool / vault address (0x...); "" => MONITOR_TARGET.
#   MONITOR_LIQ_SIG         cast-call signature for the reserve / TVL proxy
#                           (e.g. "totalAssets()"); "" => native `cast balance`.
#   MONITOR_LIQ_DROP_BP     drop band in basis points (0..10000); "" => 0 (any drop).
#   MONITOR_LIQ_LABEL       a human label for the pool / vault (alert body).
#
# flow-watcher (#1096) — flags an abnormal net outflow burst over a window:
#   MONITOR_FLOW_TARGET     the watched address (0x...); "" => MONITOR_TARGET.
#   MONITOR_FLOW_SIG        cast-call signature for the level proxy (e.g.
#                           "totalAssets()"); "" => native `cast balance`.
#   MONITOR_FLOW_OUT_BP     per-window outflow band in basis points (0..10000);
#                           "" => 0 (any net outflow).
#   MONITOR_FLOW_LABEL      a human label for the contract (alert body).
#
# pause-state-watcher (#1096) — flags a paused() / circuit-breaker transition:
#   MONITOR_PAUSE_TARGET    the watched address (0x...); "" => MONITOR_TARGET.
#   MONITOR_PAUSE_SIG       cast-call signature returning the pause boolean;
#                           "" => default "paused()".
#   MONITOR_PAUSE_LABEL     a human label for the contract (alert body).
#
# Alert delivery — the bus->webhook bridge (notifier; #1092/#1093/#1094):
#   MONITOR_WEBHOOK_URL     a Discord/Slack incoming-webhook URL. When set,
#                           notify.sh POSTs the alert payload to it. NEVER commit
#                           a real URL — export it in the operator's environment.
#   MONITOR_WEBHOOK_URL_WARN  channel for `warn`-severity pages; falls back to
#                           MONITOR_WEBHOOK_URL when unset (#1094 severity routing).
#   MONITOR_WEBHOOK_URL_HIGH  channel for `high`-severity pages; falls back to
#                           MONITOR_WEBHOOK_URL when unset (#1094 severity routing).
#   MONITOR_HEARTBEAT_INTERVAL_S  heartbeat cadence in seconds (#1093); "" => 86400
#                           (daily); 0 => heartbeat disabled.
#   MONITOR_DEADMAN_WINDOW_S  dead-man's switch window in seconds (#1093); "" => 0
#                           (disabled); when >0, no fresh watcher tick within the
#                           window emits a `high`/`liveness` meta-alert (RPC-blind).
#   MONITOR_NOTIFY_MAX_RETRIES  bounded retry count on a transient webhook failure
#                           (#1094); "" => 3.
#   MONITOR_NOTIFY_BACKOFF_S  initial backoff seconds, doubled each retry (#1094);
#                           "" => 2.
#   MONITOR_NOTIFY_DEDUP_COOLDOWN_S  sink-side dedup cooldown in seconds (#1094);
#                           "" / 0 => disabled (no defence-in-depth dedup).
#   MONITOR_NOTIFY_STATE_DIR  where notify.sh persists last-sent signatures
#                           (#1094); "" => ${XDG_STATE_HOME:-$HOME/.local/state}/
#                           dark-factory-monitor.
[monitor]
cast = ""
rpc_url = ""
target = ""
oracle = ""
webhook_url = ""
